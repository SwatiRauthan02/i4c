  <script type="text/javascript">
    $(window).on('load', function(){
      $('.load_tooltip').tipso({
        position : 'bottom'
      });
      $('.load_tooltip').tipso('hide');
      var p = $('.load_tooltip');
      var position = p.position();
      $('.load_tooltip').tipso({
        offsetX : position.top,
        offsetY : position.left,
      });
      $('.load_tooltip').tipso('show');
    });
    function scrollTable() {
      $('.load_tooltip').tipso({
        position : 'bottom'
      });
      $('.load_tooltip').tipso('hide');
      var p = $('.load_tooltip');
      var position = p.position();
      $('.load_tooltip').tipso({
        offsetX : position.top,
        offsetY : position.left,
        position : 'bottom'
      });
      $('.load_tooltip').tipso('show');
    }
  </script>
